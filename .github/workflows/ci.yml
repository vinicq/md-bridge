name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-verify main once a week. Without this, main is only ever checked on push,
  # so a floating dependency can break it and the badge stays green until the
  # next commit. That is how an uncapped playwright broke md-to-pdf for 13 days
  # (#483). Runs an hour before the Scorecard cron.
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        working-directory: apps/api
        run: python -m pip install -e ".[dev,ocr,grid-tables]"

      # md-to-pdf renders with the Chromium baked into the playwright/python
      # image pinned in apps/api/Dockerfile, which never runs `playwright
      # install`. If the pip package and the image drift apart in major.minor,
      # the browser is not where the package looks for it and the route answers
      # 500. This turns that into a named failure here instead of an opaque 500
      # in the deploy smoke. Mirrors the web-axis guard in visual-regression.yml.
      #
      # major.minor is the right granularity, not the full version: Playwright
      # pins browser revisions per minor. Checked browsers.json across every
      # minor that has a patch release (1.25.0/1/2, 1.32.0/1, 1.41.0/1/2,
      # 1.45.0/1, 1.49.0/1) and chromium, firefox and webkit revisions are
      # identical within each. Comparing full versions would only make a
      # playwright patch release red the CI until someone bumps the image tag.
      - name: Verify playwright matches the api container image
        run: |
          set -euo pipefail
          img=$(sed -n 's|.*playwright/python:v\([0-9][0-9]*\.[0-9][0-9]*\).*|\1|p' apps/api/Dockerfile)
          if [ -z "$img" ]; then
            echo "::error::could not read the playwright/python tag from apps/api/Dockerfile"
            exit 1
          fi
          pkg=$(python -c "import importlib.metadata as m; print(m.version('playwright'))")
          echo "playwright pip: $pkg (image: v$img)"
          case "$pkg" in
            "$img".*) ;;
            *) echo "::error::playwright $pkg does not match the v$img image in apps/api/Dockerfile. Bump the image tag and the pyproject ceiling together."; exit 1 ;;
          esac

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por tesseract-ocr-spa

      - name: Lint backend (ruff)
        run: python -m ruff check apps/api tests packages --config apps/api/pyproject.toml

      - name: Scan test honesty (falsegreen)
        # Detects false-positive ("rotten green") Python tests. Exit 20 means a
        # HIGH-confidence finding and fails the job; exit 10 (LOW only) and 0
        # (clean) pass. LOW findings print here and in the job summary for
        # visibility but never block: posting them to code scanning turned them
        # into PR review threads that the "require conversation resolution" rule
        # treated as blockers, which is exactly the friction this gate avoids.
        # This is a static Python layer and does NOT replace the E2E honesty
        # gates (the Playwright suite reads the real converted artifact) nor
        # cover the Vitest tests in apps/web.
        run: |
          set +e
          python -m falsegreen apps/api/tests tests | tee falsegreen.txt
          code=$?
          echo "falsegreen exit: $code"
          {
            echo "### falsegreen (test honesty)"
            echo '```'
            tail -n 2 falsegreen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 20 ]; then
            echo "::error::falsegreen found HIGH-confidence false-positive test(s)"
            exit 1
          fi
          exit 0

      - name: Install Chromium for Playwright
        run: python -m playwright install chromium --with-deps

      - name: Run backend unit tests with coverage
        run: python -m pytest apps/api/tests --cov=apps/api/app --cov-report=xml

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: backend
          name: backend-pytest
          fail_ci_if_error: false

      - name: Run root-level integration tests
        run: python -m pytest tests

      # #32: the committed OpenAPI snapshot and the generated TS types must match
      # the live FastAPI schema. Regenerate both here and fail on any diff so a
      # backend schema change that skips `npm run gen:api` cannot land silently.
      - name: Set up Node 22 for the OpenAPI client drift check
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies (for gen:api)
        working-directory: apps/web
        run: npm ci || npm install

      - name: Check the OpenAPI client is in sync
        run: |
          python -m app.export_openapi > apps/web/src/lib/openapi.json
          npm --prefix apps/web run gen:api
          git diff --exit-code apps/web/src/lib/openapi.json apps/web/src/lib/api-types.ts

  web:
    name: Web (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Lint web
        working-directory: apps/web
        run: npm run lint

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Run web tests
        working-directory: apps/web
        run: npm run test

  e2e:
    name: End-to-end (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [backend, web]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/api
        run: python -m pip install -e ".[dev]"

      - name: Install Chromium for the backend
        run: python -m playwright install chromium --with-deps

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Install ${{ matrix.browser }} for the web tests
        working-directory: apps/web
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Run Playwright end-to-end tests (${{ matrix.browser }})
        working-directory: apps/web
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report/
          retention-days: 14

  deploy-smoke:
    name: Deploy smoke (compose)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Builds the real api and web images from this PR and brings the
      # same-origin stack up, plus the `edge` Caddy proxy that mirrors the
      # production topology. No --wait: the smoke tests below poll
      # /api/health over real HTTP, which is the gate we care about, and it
      # avoids coupling this job to the web container's internal healthcheck.
      - name: Build and start the compose stack (with the edge proxy)
        run: docker compose --profile edge up -d --build

      # Deploy integrity gate over real HTTP, no mocks. Two origins:
      #   :5173  the web nginx proxying /api directly (compose default)
      #   :8080  Caddy in front, the production same-origin topology
      # The Caddy leg catches an /api prefix-strip regression that the nginx
      # leg would miss. smoke.py waits up to 60s for health, then converts.
      - name: Smoke the web nginx path
        env:
          SMOKE_BASE_URL: http://localhost:5173
        run: python scripts/smoke.py

      - name: Smoke through the Caddy edge proxy
        env:
          SMOKE_BASE_URL: http://localhost:8080
        run: python scripts/smoke.py

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose --profile edge logs

      - name: Tear down
        if: always()
        run: docker compose --profile edge down -v
