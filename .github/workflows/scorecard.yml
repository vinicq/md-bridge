name: OpenSSF Scorecard

# Runs the OSSF Scorecard checks weekly and on every push to main. The score
# (and per-check breakdown) shows up in the Security tab and is uploaded as
# a SARIF artifact so it appears alongside CodeQL findings. The badge link
# in the README points at https://scorecard.dev/.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"  # Mondays at 07:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact (debug)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

      - name: Upload SARIF to GitHub code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          sarif_file: results.sarif
